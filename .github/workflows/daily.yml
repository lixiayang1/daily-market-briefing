name: daily-briefing

on:
  schedule:
    - cron: "0 0 * * *"    # 08:00 北京（主）
    - cron: "0 3 * * *"    # 11:00 北京（兜底）
    - cron: "0 5 * * *"    # 13:00 北京（兜底）
    - cron: "30 6 * * *"   # 14:30 北京（兜底；GitHub 高峰期定时任务可能延迟数小时）
  workflow_dispatch:
    inputs:
      resend_date:
        description: "补发指定日期简报的微信推送（如 2026-11-01），留空则正常运行"
        required: false
        type: string
      force:
        description: "强制生成（跳过发布窗口与去重检查），仅用于人工修复"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SCT_KEYS: ${{ secrets.SCT_KEYS }}

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查今日是否已发布（读 main 上的索引，避免线上部署滞后误判）
        id: published
        run: |
          if [ -n "${{ inputs.resend_date }}" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(TZ=Asia/Shanghai date +%F)
          PUBLISHED=$(git show origin/main:public/briefings/index.json | python3 -c "import json,sys; print(json.load(sys.stdin)['briefings'][0]['date'])")
          if [ "$PUBLISHED" = "$TODAY" ]; then
            echo "今日简报已发布（$TODAY），本次运行跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "今日尚未发布（最新=$PUBLISHED），继续执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.published.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.published.outputs.skip != 'true'
        with:
          node-version: "20"

      - name: 安装依赖与中文字体
        if: steps.published.outputs.skip != 'true'
        run: |
          pip install --quiet matplotlib
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm ci --silent

      - name: 生成简报并提交 main
        if: steps.published.outputs.skip != 'true' && inputs.resend_date == ''
        env:
          FORCE_FLAG: ${{ inputs.force }}
        run: |
          if [ "$FORCE_FLAG" = "true" ]; then export FORCE=1; fi
          python -u scripts/daily_briefing.py gen

      - name: 构建站点
        if: steps.published.outputs.skip != 'true' && inputs.resend_date == ''
        run: npm run build

      - name: 部署 gh-pages（根目录直放构建产物）
        if: steps.published.outputs.skip != 'true' && inputs.resend_date == ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch origin gh-pages
          git checkout gh-pages
          git rm -r --cached . -q
          git clean -fdq -e dist -e node_modules
          printf 'node_modules/\n' > .gitignore
          cp -R dist/. .
          touch .nojekyll
          rm -rf dist
          git add -A
          git commit -q -m "deploy $(TZ=Asia/Shanghai date +%F)" || echo "nothing to deploy"
          git push origin gh-pages
          git checkout main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 验证并推送微信
        if: steps.published.outputs.skip != 'true'
        run: |
          if [ -n "${{ inputs.resend_date }}" ]; then
            python -u scripts/daily_briefing.py resend "${{ inputs.resend_date }}"
          else
            python -u scripts/daily_briefing.py notify
          fi
